<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Gestion Dépenses - Sénégal</title>
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== STYLE AFRICAIN ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f5f0e7;
            background-image: repeating-linear-gradient(45deg, rgba(0, 85, 0, 0.03) 0px, rgba(0, 85, 0, 0.03) 20px,
                                                          rgba(255, 215, 0, 0.03) 20px, rgba(255, 215, 0, 0.03) 40px);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: #ffffff;
            border-radius: 40px 40px 20px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2), 0 0 0 8px #00853f, 0 0 0 12px #fdcb2b, 0 0 0 16px #e31b23;
            padding: 30px;
            position: relative;
            transition: all 0.3s ease;
        }

        /* Motif africain en haut */
        .container::before {
            content: "✦ ✧ ✦ ✧ ✦ ✧ ✦";
            display: block;
            text-align: center;
            font-size: 1.8rem;
            letter-spacing: 12px;
            color: #e31b23;
            background: #fdcb2b;
            padding: 8px 0;
            border-radius: 30px 30px 0 0;
            margin: -30px -30px 20px -30px;
            border-bottom: 6px solid #00853f;
            word-spacing: 8px;
        }

        /* En-tête Sénégal */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
            border-bottom: 3px dashed #00853f;
            padding-bottom: 15px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #00853f;
            text-shadow: 2px 2px 0 #fdcb2b, 4px 4px 0 #e31b23;
            letter-spacing: 2px;
        }

        .header h1 i {
            color: #e31b23;
            margin-right: 10px;
        }

        .senegal-flag {
            display: flex;
            gap: 5px;
            background: #1a1a1a;
            padding: 6px 12px;
            border-radius: 40px;
            align-items: center;
        }

        .senegal-flag span {
            display: inline-block;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid white;
        }
        .green { background: #00853f; }
        .gold { background: #fdcb2b; }
        .red { background: #e31b23; }

        .user-name {
            font-size: 1.8rem;
            font-weight: bold;
            color: #e31b23;
            background: #fdcb2b;
            padding: 5px 25px;
            border-radius: 40px;
            border: 3px solid #00853f;
            display: inline-block;
            margin-top: 10px;
        }

        .user-name i {
            color: #00853f;
            margin-right: 8px;
        }

        /* Solde */
        .balance-box {
            background: linear-gradient(135deg, #00853f 0%, #006b32 100%);
            padding: 25px;
            border-radius: 30px;
            color: white;
            text-align: center;
            margin: 20px 0 30px;
            border: 4px solid #fdcb2b;
            box-shadow: inset 0 -6px 0 #e31b23;
        }

        .balance-box h2 {
            font-size: 1.3rem;
            opacity: 0.9;
            letter-spacing: 2px;
        }

        .balance-box .amount {
            font-size: 4rem;
            font-weight: 900;
            text-shadow: 3px 3px 0 #e31b23;
            margin: 5px 0;
        }

        .balance-box .amount small {
            font-size: 1.8rem;
            font-weight: 400;
        }

        /* Formulaire */
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            background: #f0ebe0;
            padding: 20px;
            border-radius: 30px;
            border-left: 8px solid #00853f;
            border-right: 8px solid #e31b23;
            margin-bottom: 30px;
        }

        .form-row input, .form-row select, .form-row button {
            padding: 14px 18px;
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            flex: 1 1 150px;
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
        }

        .form-row input:focus, .form-row select:focus {
            outline: 3px solid #fdcb2b;
            transform: scale(1.02);
        }

        .form-row button {
            background: #e31b23;
            color: white;
            font-weight: bold;
            cursor: pointer;
            flex: 0 1 180px;
            border: 3px solid #fdcb2b;
            letter-spacing: 1px;
        }

        .form-row button:hover {
            background: #00853f;
            transform: scale(1.05);
        }

        .form-row button i {
            margin-right: 8px;
        }

        /* Liste des dépenses */
        .expense-list {
            background: #faf8f2;
            border-radius: 30px;
            padding: 15px 20px;
            border: 3px solid #00853f;
        }

        .expense-list h3 {
            font-size: 1.8rem;
            color: #e31b23;
            border-bottom: 4px dotted #fdcb2b;
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 12px 20px;
            margin-bottom: 8px;
            border-radius: 60px;
            border-left: 10px solid #fdcb2b;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: 0.2s;
        }

        .expense-item:hover {
            transform: translateX(8px);
            border-left-color: #e31b23;
        }

        .expense-item .info {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .expense-item .info .cat {
            background: #00853f;
            color: white;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .expense-item .amount {
            font-weight: 800;
            color: #e31b23;
            font-size: 1.3rem;
        }

        .expense-item .delete-btn {
            background: none;
            border: none;
            color: #999;
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .expense-item .delete-btn:hover {
            color: #e31b23;
            transform: scale(1.3);
        }

        .empty-msg {
            text-align: center;
            color: #777;
            font-style: italic;
            padding: 25px 0;
            font-size: 1.2rem;
        }

        .total-footer {
            text-align: right;
            font-weight: bold;
            font-size: 1.4rem;
            padding: 15px 10px 0;
            border-top: 3px double #fdcb2b;
            margin-top: 10px;
            color: #00853f;
        }

        .total-footer span {
            color: #e31b23;
            font-size: 2rem;
        }

        /* Responsive */
        @media (max-width: 700px) {
            .container { padding: 15px; }
            .container::before { font-size: 1.2rem; letter-spacing: 6px; }
            .header h1 { font-size: 1.8rem; }
            .balance-box .amount { font-size: 2.8rem; }
            .user-name { font-size: 1.4rem; padding: 3px 18px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- En-tête avec le nom PRESLEY -->
    <div class="header">
        <h1><i class="fas fa-africa"></i> Dépenses <span style="color:#e31b23;">Sénégal</span></h1>
        <div class="senegal-flag">
            <span class="green"></span>
            <span class="gold"></span>
            <span class="red"></span>
        </div>
    </div>

    <div style="text-align: center; margin-bottom: 10px;">
        <div class="user-name">
            <i class="fas fa-user-circle"></i> Presley
        </div>
        <p style="color: #00853f; font-weight: 600; margin-top: 5px;">
            <i class="fas fa-map-pin"></i> Dakar, Sénégal · Teranga !
        </p>
    </div>

    <!-- Solde -->
    <div class="balance-box">
        <h2><i class="fas fa-wallet"></i> Solde restant</h2>
        <div class="amount" id="balanceDisplay">0 <small>FCFA</small></div>
    </div>

    <!-- Formulaire d'ajout -->
    <div class="form-row">
        <input type="text" id="descriptionInput" placeholder="Description (ex: Ngalax)" />
        <input type="number" id="amountInput" placeholder="Montant (FCFA)" min="0" />
        <select id="categorySelect">
            <option value="Nourriture">🍛 Nourriture</option>
            <option value="Transport">🚍 Transport</option>
            <option value="Logement">🏠 Logement</option>
            <option value="Santé">💊 Santé</option>
            <option value="Loisirs">🎵 Loisirs</option>
            <option value="Autre">🔱 Autre</option>
        </select>
        <button id="addBtn"><i class="fas fa-plus-circle"></i> Ajouter</button>
    </div>

    <!-- Liste des dépenses -->
    <div class="expense-list">
        <h3>
            <span><i class="fas fa-list-ul"></i> Dépenses</span>
            <span style="font-size: 1rem; color: #00853f;">
                <i class="fas fa-flag"></i> Sénégal
            </span>
        </h3>
        <div id="expenseItems">
            <!-- Les dépenses seront injectées ici par JavaScript -->
            <div class="empty-msg">
                <i class="fas fa-leaf"></i> Aucune dépense enregistrée, Presley. <br>
                <small style="color:#e31b23;">Ajoute ta première dépense !</small>
            </div>
        </div>
        <div class="total-footer">
            Total : <span id="totalExpenses">0</span> FCFA
        </div>
    </div>

</div>

<script>
    (function() {
        // === Données ===
        let expenses = [];
        let balance = 500000; // Solde initial en FCFA (500 000 FCFA)

        // Éléments DOM
        const balanceDisplay = document.getElementById('balanceDisplay');
        const expenseItems = document.getElementById('expenseItems');
        const totalExpensesSpan = document.getElementById('totalExpenses');

        const descriptionInput = document.getElementById('descriptionInput');
        const amountInput = document.getElementById('amountInput');
        const categorySelect = document.getElementById('categorySelect');
        const addBtn = document.getElementById('addBtn');

        // === Mise à jour de l'UI ===
        function render() {
            // 1. Calcul du total des dépenses
            const total = expenses.reduce((sum, e) => sum + e.amount, 0);
            const remaining = balance - total;

            // 2. Mise à jour du solde
            balanceDisplay.innerHTML = `${remaining.toLocaleString()} <small>FCFA</small>`;
            if (remaining < 0) {
                balanceDisplay.style.color = '#e31b23';
            } else {
                balanceDisplay.style.color = 'white';
            }

            // 3. Mise à jour du total en bas
            totalExpensesSpan.textContent = total.toLocaleString();

            // 4. Génération de la liste
            if (expenses.length === 0) {
                expenseItems.innerHTML = `
                    <div class="empty-msg">
                        <i class="fas fa-leaf"></i> Aucune dépense enregistrée, Presley. <br>
                        <small style="color:#e31b23;">Ajoute ta première dépense !</small>
                    </div>
                `;
                return;
            }

            let html = '';
            // On affiche les dépenses du plus récent au plus ancien
            const sorted = [...expenses].reverse();
            sorted.forEach((exp, index) => {
                // On récupère l'index réel dans le tableau original pour la suppression
                const realIndex = expenses.length - 1 - index;
                html += `
                    <div class="expense-item" data-index="${realIndex}">
                        <div class="info">
                            <span style="font-weight:600;">${exp.description}</span>
                            <span class="cat">${exp.category}</span>
                            <span>${exp.amount.toLocaleString()} FCFA</span>
                        </div>
                        <button class="delete-btn" data-index="${realIndex}">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `;
            });

            expenseItems.innerHTML = html;

            // === Événements de suppression ===
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const idx = parseInt(this.getAttribute('data-index'), 10);
                    if (!isNaN(idx) && idx >= 0 && idx < expenses.length) {
                        expenses.splice(idx, 1);
                        render();
                    }
                });
            });
        }

        // === Ajouter une dépense ===
        function addExpense() {
            const description = descriptionInput.value.trim();
            const amount = parseFloat(amountInput.value);
            const category = categorySelect.value;

            if (!description) {
                alert('Presley, entre une description ! (ex: "Mangué", "Essence")');
                descriptionInput.focus();
                return;
            }

            if (isNaN(amount) || amount <= 0) {
                alert('Entre un montant valide en FCFA !');
                amountInput.focus();
                return;
            }

            // Création de la dépense
            const newExpense = {
                description: description,
                amount: amount,
                category: category
            };

            expenses.push(newExpense);
            render();

            // Réinitialiser les champs
            descriptionInput.value = '';
            amountInput.value = '';
            descriptionInput.focus();
        }

        // === Événements ===
        addBtn.addEventListener('click', addExpense);

        // Ajout avec la touche "Entrée" depuis le champ montant
        amountInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addExpense();
            }
        });

        descriptionInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                amountInput.focus();
            }
        });

        // === Initialisation avec quelques dépenses "Sénégalaises" ===
        function initDemo() {
            expenses = [
                { description: 'Thiéboudienne', amount: 5000, category: 'Nourriture' },
                { description: 'Taxi Dakar - Yoff', amount: 2500, category: 'Transport' },
                { description: 'Achat de tissu Wax', amount: 12000, category: 'Autre' },
                { description: 'Frais de santé', amount: 8000, category: 'Santé' },
                { description: 'Concert de Sabar', amount: 3500, category: 'Loisirs' }
            ];
            render();
        }

        // Démarrer avec des données
        initDemo();
    })();
</script>

</body>
</html>

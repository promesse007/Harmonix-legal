<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmarTCoach Pro — Gestion Financière Universelle</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .tab-active { border-bottom: 4px solid #2563eb; color: #2563eb; font-weight: 600; }
        .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="bg-gray-50 dark:bg-neutral-950 text-gray-900 dark:text-neutral-100 min-h-screen">

    <nav class="bg-white dark:bg-neutral-900 border-b border-gray-200 dark:border-neutral-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-8 py-5 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-600 via-indigo-600 to-violet-600 rounded-2xl flex items-center justify-center text-white shadow-xl">
                    <i class="fa-solid fa-coins text-2xl"></i>
                </div>
                <div>
                    <span class="text-3xl font-bold tracking-tighter">SmarTCoach</span>
                    <span class="text-blue-600 font-semibold">Pro</span>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <button onclick="toggleTheme()" class="text-2xl">🌗</button>
                <button onclick="showAPIConfig()" class="flex items-center gap-2 px-5 py-2.5 bg-neutral-900 text-white rounded-2xl hover:bg-black">
                    <i class="fa-solid fa-key"></i> API IA
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-8 py-8">
        <!-- Tabs -->
        <div class="flex gap-10 border-b border-gray-200 dark:border-neutral-800 mb-10 overflow-x-auto">
            <button onclick="switchTab(0)" id="tab-0-btn" class="tab-active pb-4">🏠 Accueil & Profil</button>
            <button onclick="switchTab(1)" id="tab-1-btn" class="pb-4 text-gray-500 dark:text-neutral-400 hover:text-gray-700">💰 Mes Flux</button>
            <button onclick="switchTab(2)" id="tab-2-btn" class="pb-4 text-gray-500 dark:text-neutral-400 hover:text-gray-700">📊 Tableau de Bord</button>
            <button onclick="switchTab(3)" id="tab-3-btn" class="pb-4 text-gray-500 dark:text-neutral-400 hover:text-gray-700">🧠 Audit IA</button>
        </div>

        <!-- TAB 0 : Profil Universel -->
        <section id="tab-0" class="space-y-10">
            <div class="bg-white dark:bg-neutral-900 rounded-3xl p-10 shadow-sm">
                <h1 class="text-4xl font-bold mb-2">Bienvenue dans votre coach financier personnel</h1>
                <p class="text-lg text-gray-500 dark:text-neutral-400">Peu importe qui vous êtes ou où vous vivez, SmarTCoach s’adapte.</p>

                <div class="grid md:grid-cols-3 gap-6 mt-10">
                    <div>
                        <label class="block text-sm font-medium mb-2">Votre profil</label>
                        <select id="profile" class="w-full rounded-2xl px-6 py-4 bg-gray-100 dark:bg-neutral-800">
                            <option value="Femme Commerçante">👩🏾‍💼 Femme Commerçante</option>
                            <option value="Restaurateur">🍲 Restaurateur / Traiteur</option>
                            <option value="Salarié">💼 Salarié / Fonctionnaire</option>
                            <option value="Étudiant">🎓 Étudiant</option>
                            <option value="Femme au foyer">🏠 Femme au foyer</option>
                            <option value="Entrepreneur">🚀 Entrepreneur</option>
                            <option value="Autre">Autre</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Pays</label>
                        <select id="country" onchange="updateCurrency()" class="w-full rounded-2xl px-6 py-4 bg-gray-100 dark:bg-neutral-800">
                            <option value="Côte d'Ivoire">🇨🇮 Côte d'Ivoire</option>
                            <option value="Sénégal">🇸🇳 Sénégal</option>
                            <option value="France">🇫🇷 France</option>
                            <option value="USA">🇺🇸 États-Unis</option>
                            <option value="Cameroun">🇨🇲 Cameroun</option>
                            <option value="Autre">🌍 Autre pays</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Numéro WhatsApp</label>
                        <input type="tel" id="whatsapp" placeholder="+225 07 00 00 00" 
                               class="w-full rounded-2xl px-6 py-4 bg-gray-100 dark:bg-neutral-800">
                    </div>
                </div>
                <button onclick="saveProfile()" class="mt-8 w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-5 rounded-2xl text-lg font-semibold">Valider mon profil et continuer</button>
            </div>
        </section>

        <!-- TAB 1 : Flux (avec catégories riches) -->
        <section id="tab-1" class="hidden">
            <div class="grid md:grid-cols-2 gap-8">
                <!-- Revenus -->
                <div class="bg-white dark:bg-neutral-900 rounded-3xl p-8">
                    <h3 class="text-2xl font-semibold mb-6">💰 Revenus</h3>
                    <input id="income-val" type="number" placeholder="Montant" class="w-full px-6 py-5 rounded-2xl bg-gray-100 dark:bg-neutral-800 text-2xl mb-4">
                    <select id="income-freq" class="w-full px-6 py-5 rounded-2xl bg-gray-100 dark:bg-neutral-800">
                        <option value="jour">Par jour</option>
                        <option value="semaine">Par semaine</option>
                        <option value="mois">Par mois</option>
                    </select>
                    <button onclick="saveIncome()" class="mt-6 w-full py-5 bg-green-600 text-white rounded-2xl font-semibold">Enregistrer revenus</button>
                </div>

                <!-- Dépenses -->
                <div class="bg-white dark:bg-neutral-900 rounded-3xl p-8">
                    <h3 class="text-2xl font-semibold mb-6">📉 Dépenses</h3>
                    <select id="exp-cat" class="w-full px-6 py-5 rounded-2xl bg-gray-100 dark:bg-neutral-800 mb-4">
                        <option value="Nourriture & Courses">🛒 Nourriture & Courses</option>
                        <option value="Loyer / Logement">🏠 Loyer / Logement</option>
                        <option value="Transport / Carburant">🚗 Transport / Carburant</option>
                        <option value="Téléphone & Internet">📱 Téléphone & Internet</option>
                        <option value="Électricité / Eau">💡 Électricité / Eau</option>
                        <option value="Santé">🩺 Santé</option>
                        <option value="Éducation">🎓 Éducation</option>
                        <option value="Vêtements & Shopping">👗 Vêtements & Shopping</option>
                        <option value="Loisirs & Sorties">🎉 Loisirs & Sorties</option>
                        <option value="Abonnements">📺 Abonnements (Netflix, etc.)</option>
                    </select>
                    <input id="exp-val" type="number" placeholder="Montant" class="w-full px-6 py-5 rounded-2xl bg-gray-100 dark:bg-neutral-800 mb-4">
                    <input id="exp-desc" type="text" placeholder="Description" class="w-full px-6 py-5 rounded-2xl bg-gray-100 dark:bg-neutral-800">
                    <button onclick="addExpense()" class="mt-6 w-full py-5 bg-red-600 text-white rounded-2xl font-semibold">Enregistrer dépense</button>
                </div>
            </div>
        </section>

        <!-- TAB 2 : Dashboard Pro -->
        <section id="tab-2" class="hidden space-y-12">
            <div class="flex justify-between">
                <h2 class="text-3xl font-bold">Tableau de Bord</h2>
                <button onclick="exportPDF()" class="px-6 py-3 bg-blue-600 text-white rounded-2xl">📄 Exporter PDF</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="summary-cards"></div>
            <div class="grid md:grid-cols-2 gap-8">
                <canvas id="pieChart" class="bg-white dark:bg-neutral-900 p-8 rounded-3xl"></canvas>
                <canvas id="barChart" class="bg-white dark:bg-neutral-900 p-8 rounded-3xl"></canvas>
            </div>
        </section>

        <!-- TAB 3 : IA -->
        <section id="tab-3" class="hidden">
            <div class="max-w-4xl mx-auto bg-gradient-to-br from-neutral-900 to-black rounded-3xl p-12 text-white">
                <h2 class="text-4xl font-bold mb-4">Votre Coach IA Personnel</h2>
                <div id="ia-output" class="min-h-96 bg-black/30 rounded-2xl p-8 text-neutral-200"></div>
                <button onclick="runRealIAAudit()" class="mt-8 w-full py-5 bg-white text-black rounded-2xl font-semibold text-lg">Lancer l’Audit IA + Question WhatsApp</button>
            </div>
        </section>
    </div>

    <!-- Modal API -->
    <div id="api-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[100]">
        <div class="bg-white dark:bg-neutral-900 rounded-3xl p-10 max-w-md w-full">
            <h3 class="text-2xl font-bold mb-6">Clé API Gemini</h3>
            <input id="gemini-key" type="password" class="w-full px-6 py-5 rounded-2xl bg-gray-100 dark:bg-neutral-800" placeholder="AIzaSy...">
            <button onclick="saveAPIKey()" class="mt-6 w-full py-5 bg-blue-600 text-white rounded-2xl">Enregistrer la clé</button>
        </div>
    </div>

    <script>
        let appState = { profile: "", country: "", whatsapp: "", currency: "FCFA", income: 0, incomeFreq: "mois", expenses: [] };
        let geminiKey = localStorage.getItem('gemini_key') || '';

        function switchTab(n) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`tab-${n}`).classList.remove('hidden');
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }

        function saveProfile() {
            appState.profile = document.getElementById('profile').value;
            appState.country = document.getElementById('country').value;
            appState.whatsapp = document.getElementById('whatsapp').value;
            alert("✅ Profil enregistré !");
            switchTab(1);
        }

        function updateCurrency() {
            const country = document.getElementById('country').value;
            if (country.includes("France") || country.includes("USA")) appState.currency = "EUR";
            else appState.currency = "FCFA";
        }

        function saveIncome() {
            appState.income = parseFloat(document.getElementById('income-val').value) || 0;
            appState.incomeFreq = document.getElementById('income-freq').value;
            updateDashboard();
        }

        function addExpense() {
            const amount = parseFloat(document.getElementById('exp-val').value);
            if (!amount) return;
            appState.expenses.unshift({
                category: document.getElementById('exp-cat').value,
                amount: amount,
                desc: document.getElementById('exp-desc').value || "",
                date: new Date().toLocaleDateString()
            });
            updateDashboard();
        }

        function updateDashboard() {
            // Mise à jour des cartes et graphiques (simplifié pour clarté)
            console.log("Dashboard mis à jour pour", appState.profile);
            // Tu peux étendre ici avec les graphiques comme avant
        }

        async function runRealIAAudit() {
            const output = document.getElementById('ia-output');
            output.innerHTML = "🤖 Gemini analyse votre situation et prépare une question WhatsApp...";

            setTimeout(() => {
                output.innerHTML = `
                    <strong>Bonjour ${appState.profile || 'ami(e)'},</strong><br><br>
                    Aujourd’hui, combien as-tu vendu / gagné ?<br>
                    Et combien as-tu dépensé ?<br><br>
                    Réponds-moi directement ici, je vais t’aider à mieux gérer ton argent.
                    <br><br><span class="text-green-400">Simulation WhatsApp envoyée sur ${appState.whatsapp || 'votre numéro'}</span>
                `;
            }, 1500);
        }

        function saveAPIKey() {
            geminiKey = document.getElementById('gemini-key').value;
            localStorage.setItem('gemini_key', geminiKey);
            alert("Clé sauvegardée");
        }

        function showAPIConfig() {
            document.getElementById('api-modal').classList.remove('hidden');
        }

        function exportPDF() {
            alert("Rapport PDF généré (simulation)");
        }

        // Init
        window.onload = () => switchTab(0);
    </script>
</body>
</html>
